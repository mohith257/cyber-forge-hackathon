[package]
name = "cb-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chromiumoxide = { version = "0.9.1", default-features = false }
futures-util = "0.3.34"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.9"

[target."cfg(windows)".dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "gzip", "http2", "charset"] }

[target."cfg(not(windows))".dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "http2", "charset"] }
